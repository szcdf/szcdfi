name: Release

# Publishes szcdfi to PyPI with `uv publish`.
#
# Trigger: push a version tag (e.g. `v0.1.0`), or run manually.
#
# Authentication: PyPI Trusted Publishing (OIDC) is used by default -- configure
# this repository as a trusted publisher for the `szcdfi` project on PyPI and no
# secret is needed. Alternatively set the `PYPI_API_TOKEN` repository secret and
# uv will use it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish (trusted publishing, or token if set)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
