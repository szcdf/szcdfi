[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. Unlike the owner's other packages, this one is
# published under its plain name so `uvx szcdfi@latest` resolves verbatim; the
# plain name was free on PyPI. Import package and console script are `szcdfi`.
name = "szcdfi"
description = "Cross-platform installer engine for the szcdf dotfiles framework."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Stephen Zhao" }]
keywords = ["dotfiles", "installer", "szcdf", "shell", "configuration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Installation/Setup",
  "Topic :: Utilities",
]
# Pure stdlib. No third-party RUNTIME dependencies, by design (ADR-0003).
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/szcdf/szcdfi"
Repository = "https://github.com/szcdf/szcdfi"
Issues = "https://github.com/szcdf/szcdfi/issues"

[project.scripts]
szcdfi = "szcdfi.cli:main"

# What `uv run` installs, and what the release workflow needs present. Kept in
# step with the owner's other Python repos: bump-my-version does the bumping, uv
# does the building, pytest does the rest.
[tool.uv]
dev-dependencies = [
    "bump-my-version>=1.2.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "uv>=0.8.11",
]

# Single source of truth for the version: src/szcdfi/__init__.py
[tool.hatch.version]
path = "src/szcdfi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/szcdfi"]

[tool.hatch.build.targets.sdist]
include = ["src/szcdfi", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Coverage is opt-in per run (`make test-coverage`, or `pytest --cov`) so a plain
# `pytest` stays fast. CI runs it with the same flags.
[tool.coverage.run]
source = ["szcdfi"]
branch = true

[tool.coverage.report]
# Minimum total coverage; `pytest --cov` (and so CI) fails below it.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# The version lives in one place -- src/szcdfi/__init__.py, which hatchling reads
# for the package version. This block's own current_version is kept in step by
# bump-my-version and is what the publish workflow reads to validate a tag.
[tool.bumpversion]
current_version = "0.1.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "src/szcdfi/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
